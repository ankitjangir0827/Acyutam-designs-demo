        <button id="tab-btn-signin" onclick="switchAuthTab('signin')" class="flex-1 py-2.5 text-center font-bold border-b-2 border-primary text-primary transition-all flex items-center justify-center gap-1 cursor-pointer">
          <span class="material-symbols-outlined text-base">login</span> Sign In
        </button>
        <button id="tab-btn-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2.5 text-center font-bold border-b-2 border-transparent text-on-surface-variant hover:text-primary transition-all flex items-center justify-center gap-1 cursor-pointer">
          <span class="material-symbols-outlined text-base">person_add</span> Sign Up
        </button>
      </div>

      <!-- Sign In Form -->
      <form id="auth-form-signin" onsubmit="handleEmailSignIn(event)" class="flex flex-col gap-4">
        <div>
          <label class="block font-label-caps text-[10px] text-on-surface-variant uppercase tracking-wider mb-1.5">Email Address</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-primary material-symbols-outlined text-base">mail</span>
            <input type="email" id="signin-email" required placeholder="client@domain.com" class="w-full bg-background border border-outline-variant/40 rounded-md py-2.5 pl-10 pr-4 text-xs text-on-surface focus:border-primary focus:outline-none transition-colors"/>
          </div>
        </div>
        <div>
          <label class="block font-label-caps text-[10px] text-on-surface-variant uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-primary material-symbols-outlined text-base">lock</span>
            <input type="password" id="signin-password" required placeholder="••••••••" class="w-full bg-background border border-outline-variant/40 rounded-md py-2.5 pl-10 pr-10 text-xs text-on-surface focus:border-primary focus:outline-none transition-colors"/>
            <button type="button" onclick="togglePasswordVisibility('signin-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none cursor-pointer">
              <span class="material-symbols-outlined text-base">visibility</span>
            </button>
          </div>
        </div>
        <div id="auth-signin-error" class="hidden p-3 bg-red-500/10 border border-red-500/40 text-red-400 text-xs rounded-md font-mono"></div>
        <button type="submit" class="w-full py-3 bg-primary text-background font-label-caps text-xs font-bold uppercase tracking-widest rounded-md hover:bg-primary-container transition-all flex items-center justify-center gap-2 shadow-lg cursor-pointer">
          <span>Sign In &amp; Proceed</span>
          <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </button>
      </form>

      <!-- Sign Up Form -->
      <form id="auth-form-signup" onsubmit="handleEmailSignUp(event)" class="hidden flex flex-col gap-4">
        <div>
          <label class="block font-label-caps text-[10px] text-on-surface-variant uppercase tracking-wider mb-1.5">Full Name</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-primary material-symbols-outlined text-base">person</span>
            <input type="text" id="signup-name" required placeholder="Ram Gopal Jangir" class="w-full bg-background border border-outline-variant/40 rounded-md py-2.5 pl-10 pr-4 text-xs text-on-surface focus:border-primary focus:outline-none transition-colors"/>
          </div>
        </div>
        <div>
          <label class="block font-label-caps text-[10px] text-on-surface-variant uppercase tracking-wider mb-1.5">Email Address</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-primary material-symbols-outlined text-base">mail</span>
            <input type="email" id="signup-email" required placeholder="name@domain.com" class="w-full bg-background border border-outline-variant/40 rounded-md py-2.5 pl-10 pr-4 text-xs text-on-surface focus:border-primary focus:outline-none transition-colors"/>
          </div>
        </div>
        <div>
          <label class="block font-label-caps text-[10px] text-on-surface-variant uppercase tracking-wider mb-1.5">Password</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-primary material-symbols-outlined text-base">lock</span>
            <input type="password" id="signup-password" required minlength="6" placeholder="Min. 6 characters" class="w-full bg-background border border-outline-variant/40 rounded-md py-2.5 pl-10 pr-10 text-xs text-on-surface focus:border-primary focus:outline-none transition-colors"/>
            <button type="button" onclick="togglePasswordVisibility('signup-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none cursor-pointer">
              <span class="material-symbols-outlined text-base">visibility</span>
            </button>
          </div>
        </div>
        <div id="auth-signup-error" class="hidden p-3 bg-red-500/10 border border-red-500/40 text-red-400 text-xs rounded-md font-mono"></div>
        <button type="submit" class="w-full py-3 bg-primary text-background font-label-caps text-xs font-bold uppercase tracking-widest rounded-md hover:bg-primary-container transition-all flex items-center justify-center gap-2 shadow-lg cursor-pointer">
          <span>Create Account &amp; Proceed</span>
          <span class="material-symbols-outlined text-sm">person_add</span>
        </button>
      </form>

      <div class="relative flex items-center justify-center my-1">
        <div class="border-t border-outline-variant/30 w-full"></div>
        <span class="bg-surface-container-low px-3 font-label-caps text-[10px] text-on-surface-variant uppercase absolute">OR</span>
      </div>
      <button type="button" onclick="handleQuickGoogleAuth()" class="w-full py-2.5 border border-outline-variant/40 hover:border-primary bg-background/50 text-on-surface font-label-caps text-xs tracking-wider rounded-md transition-all flex items-center justify-center gap-3 cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>Continue with Google</span>
      </button>

      <p class="font-label-caps text-[10px] text-center text-on-surface-variant/70 mt-1">
        🔒 Encrypted &amp; Secure Authentication — Achyutam Builder®
      </p>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const icon = btn.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        if (icon) icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        if (icon) icon.textContent = 'visibility';
      }
    }

    function openAuthModal() {
      const modal = document.getElementById('auth-modal');
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        modal.style.display = 'flex';
      }
    }

    function closeAuthModal() {
      const modal = document.getElementById('auth-modal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        modal.style.display = 'none';
      }
    }

    function switchAuthTab(tab) {
      const btnSignin = document.getElementById('tab-btn-signin');
      const btnSignup = document.getElementById('tab-btn-signup');

      const formSignin = document.getElementById('auth-form-signin');
      const formSignup = document.getElementById('auth-form-signup');

      const activeClass = 'flex-1 py-2.5 text-center font-bold border-b-2 border-primary text-primary transition-all flex items-center justify-center gap-1 cursor-pointer';
      const inactiveClass = 'flex-1 py-2.5 text-center font-bold border-b-2 border-transparent text-on-surface-variant hover:text-primary transition-all flex items-center justify-center gap-1 cursor-pointer';

      if (btnSignin) btnSignin.className = tab === 'signin' ? activeClass : inactiveClass;
      if (btnSignup) btnSignup.className = tab === 'signup' ? activeClass : inactiveClass;

      if (formSignin) formSignin.classList.toggle('hidden', tab !== 'signin');
      if (formSignup) formSignup.classList.toggle('hidden', tab !== 'signup');
    }

    function saveAuthAndDeployEnquiry(email, type, isAdmin = false, displayName = '') {
      const cleanEmail = email.toLowerCase().trim();
      const isUserAdmin = isAdmin || cleanEmail === 'ankitjangir529@gmail.com';
      const name = displayName || (isUserAdmin ? 'ANKITJANGIR' : cleanEmail.split('@')[0].toUpperCase());
      const userData = { email: cleanEmail, identity: cleanEmail, name: name, displayName: name, type: type, role: isUserAdmin ? 'admin' : 'client', emailVerified: true, time: new Date().toISOString() };
      localStorage.setItem('achyutam_user', JSON.stringify(userData));
      updateAuthUI();
      closeAuthModal();
      if (isUserAdmin) {
        setTimeout(() => { window.location.href = 'admin-dashboard.html'; }, 500);
      }
    }

    async function handleEmailSignUp(e) {
      e.preventDefault();
      const errEl = document.getElementById('auth-signup-error');
      if (errEl) { errEl.classList.add('hidden'); errEl.textContent = ''; }

      const name = document.getElementById('signup-name')?.value.trim() || '';
      const email = document.getElementById('signup-email')?.value.trim() || '';
      const password = document.getElementById('signup-password')?.value || '';

      if (!email || !password) {
        if (errEl) { errEl.textContent = '⚠️ Please enter both email and password!'; errEl.classList.remove('hidden'); }
        return;
      }

      if (window.AchyutamFirebase && window.AchyutamFirebase.signUpWithEmailPassword) {
        const res = await window.AchyutamFirebase.signUpWithEmailPassword(email, password, name);
        if (res.success && res.needsVerification) {
          switchAuthTab('signin');
          const signinEmail = document.getElementById('signin-email');
          if (signinEmail) signinEmail.value = email;
          const signinErr = document.getElementById('auth-signin-error');
          if (signinErr) {
            signinErr.innerHTML = `📧 <strong>Verification link sent to ${email}</strong><br>Please verify your email via the link sent to your inbox before signing in.`;
            signinErr.classList.remove('hidden');
          }
          return;
        } else if (errEl) {
          errEl.textContent = '⚠️ ' + (res.error || 'Sign up failed');
          errEl.classList.remove('hidden');
          return;
        }
      }
    }

    async function handleEmailSignIn(e) {
      e.preventDefault();
      const errEl = document.getElementById('auth-signin-error');
      if (errEl) { errEl.classList.add('hidden'); errEl.textContent = ''; }

      const email = document.getElementById('signin-email')?.value.trim() || '';
      const password = document.getElementById('signin-password')?.value || '';

      if (!email || !password) {
        if (errEl) { errEl.textContent = '⚠️ Please enter both email and password!'; errEl.classList.remove('hidden'); }
        return;
      }

      if (window.AchyutamFirebase && window.AchyutamFirebase.signInWithEmailPassword) {
        const res = await window.AchyutamFirebase.signInWithEmailPassword(email, password);
        if (res.success) {
          saveAuthAndDeployEnquiry(email, 'email', res.isAdmin, res.user?.displayName);
          return;
        } else if (res.emailUnverified) {
          if (errEl) {
            errEl.innerHTML = `⚠️ <strong>Email Not Verified:</strong> Please check your email inbox at <span class="underline">${email}</span> and verify your account.`;
            errEl.classList.remove('hidden');
          }
          return;
        } else if (errEl) {
          errEl.textContent = '⚠️ ' + (res.error || 'Invalid email or password!');
          errEl.classList.remove('hidden');
          return;
        }
      }
    }

    async function handleQuickGoogleAuth() {
      if (window.AchyutamFirebase && window.AchyutamFirebase.signInWithGoogleFirebase) {
        const res = await window.AchyutamFirebase.signInWithGoogleFirebase();
        if (res.success && res.user) {
          saveAuthAndDeployEnquiry(res.user.email, 'google', res.isAdmin, res.user.displayName);
        } else {
          const errEl = document.getElementById('auth-signin-error');
          if (errEl) {
            errEl.textContent = '⚠️ ' + (res.error || 'Google Sign-In failed.');
            errEl.classList.remove('hidden');
          }
        }
      }
    }

    function updateAuthUI() {
      const userStr = localStorage.getItem('achyutam_user');
      const authBtnText = document.getElementById('auth-btn-text');
      const authHeaderBtn = document.getElementById('auth-header-btn');
      if (userStr && authBtnText) {
        try {
          const user = JSON.parse(userStr);
          const userEmail = (user.email || user.identity || '').toLowerCase().trim();
          const isAdmin = userEmail === 'ankitjangir529@gmail.com';
          const displayName = user.name || user.displayName || (isAdmin ? 'ANKITJANGIR' : userEmail.split('@')[0].toUpperCase());
          authBtnText.textContent = displayName.length > 12 ? displayName.substring(0, 10) + '...' : displayName;
          if (authHeaderBtn) authHeaderBtn.classList.add('bg-primary/20', 'border-primary');
        } catch(e) {}
      }
    }

    document.addEventListener('DOMContentLoaded', () => { updateAuthUI(); });
  </script>
  <script src="custom-projects-loader.js"></script>
</body>
</html>
